spring.application.name=vestra

# Render sets PORT; locally the default is 8080.
server.port=${PORT:8080}
server.shutdown=graceful
# Requests arrive through Render's proxy and Vercel's /api rewrite; trust their
# X-Forwarded-* headers so HTTPS and the original host are detected correctly.
server.forward-headers-strategy=framework

# Local dev: Spring Boot starts Postgres from the repo-root compose file.
# In production (Neon), set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD instead.
spring.docker.compose.file=../docker-compose.yml
spring.docker.compose.lifecycle-management=start-only

# Small pool: one instance, and Neon's free compute has limited connections.
spring.datasource.hikari.maximum-pool-size=5

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true

# Origins allowed to open the price WebSocket directly (Vercel can't proxy it).
vestra.web.allowed-origins=${VESTRA_ALLOWED_ORIGINS:http://localhost:5173}
